name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu deployment berjalan pada satu waktu; antrean tidak dibatalkan agar
# deploy yang sedang berjalan tidak tertinggal setengah jadi.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Siapkan Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Siapkan Pages
        uses: actions/configure-pages@v6

      - name: Install dependensi
        run: npm ci

      - name: Build situs statis
        run: npm run build

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
